<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Radial Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="#2563EB" opacity="0.25" filter="url(#glow)" />

  <!-- Bridge Waves (Connecting Bangladesh to US PSTN) -->
  <path d="M 160 170 C 210 115, 302 115, 352 170" fill="none" stroke="url(#arcGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 130 140 C 195 70, 317 70, 382 140" fill="none" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" opacity="0.7" />

  <!-- Connection Terminal Dots -->
  <circle cx="160" cy="170" r="9" fill="#38BDF8" />
  <circle cx="352" cy="170" r="9" fill="#38BDF8" />

  <!-- Modern White Phone Receiver -->
  <g transform="translate(256, 280) rotate(-42) translate(-256, -280)">
    <!-- Main Receiver Body -->
    <path d="M 210 215 C 200 215 190 222 185 232 L 175 255 C 168 270 172 288 185 298 L 226 339 C 236 349 254 353 269 346 L 292 336 C 302 331 309 321 309 310 L 305 275 C 303 260 290 250 275 250 L 255 255 C 242 242 232 232 225 220 L 230 200 C 230 185 220 172 205 170 Z"
          fill="#FFFFFF" />
    
    <!-- Accent Voice Line -->
    <path d="M 270 210 C 290 220 305 238 315 260" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
